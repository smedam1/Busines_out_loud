    <script>
            document.addEventListener('DOMContentLoaded', function() {
                const mobileMenuButton = document.getElementById('mobile-menu-button');
                const mobileMenu = document.getElementById('mobile-menu');
                
                if (mobileMenuButton && mobileMenu) {
                    mobileMenuButton.addEventListener('click', function() {
                        mobileMenu.classList.toggle('hidden');
                        mobileMenuButton.classList.toggle('hamburger-active');
                        
                        if (!mobileMenu.classList.contains('hidden')) {
                            mobileMenu.classList.add('slide-down');
                        } else {
                            mobileMenu.classList.remove('slide-down');
                        }
                    });
                }
                document.addEventListener('click', function(e) {
                    if (e.target.closest('.dropdown-item:not(.know-more-item)')) {
                        const item = e.target.closest('.dropdown-item');
                        const category = item.getAttribute('data-category');
                        const blogId = item.getAttribute('data-id');
                        
                        console.log('Clicked blog:', { category, blogId });
                    }
                });
                document.addEventListener('click', function(e) {
                    if (e.target.closest('.know-more-item')) {
                        const item = e.target.closest('.dropdown-container');
                        const category = item.getAttribute('data-category');
                        
                        console.log('Know More clicked for:', category);
                    }
                });
                const mobileMenuContainer = document.getElementById('mobile-menu');
                if (mobileMenuContainer) {
                    mobileMenuContainer.addEventListener('click', function(e) {
                        const toggle = e.target.closest('.accordion-toggle');
                        if (!toggle) return;
                        e.preventDefault();
                        const content = toggle.nextElementSibling;
                        const isCurrentlyOpen = toggle.getAttribute('aria-expanded') === 'true';
                        mobileMenuContainer.querySelectorAll('.accordion-toggle').forEach(otherToggle => {
                            if (otherToggle !== toggle) {
                                otherToggle.setAttribute('aria-expanded', 'false');
                                const otherContent = otherToggle.nextElementSibling;
                                if (otherContent) otherContent.style.maxHeight = '0px';
                            }
                        });
                        if (isCurrentlyOpen) {
                            toggle.setAttribute('aria-expanded', 'false');
                            content.style.maxHeight = '0px';
                        } else {
                            toggle.setAttribute('aria-expanded', 'true');
                            content.style.maxHeight = content.scrollHeight + 'px';
                        }
                    });
                }
            });
        </script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Listen for messages from the parent window
        window.addEventListener('message', (event) => {
          // For security, you might want to check event.origin
          // if (event.origin !== 'http://your-parent-domain.com') return;

          const command = event.data;
          console.log('Message received from parent:', command);

          // Handle fullscreen state updates from parent
          if (command && command.action === 'fullscreenEntered') {
            window.parentFullscreenState = true;
            console.log('Parent confirmed fullscreen entered');
            // Update button state when entering fullscreen
            if (window.updateButtonState) {
              window.updateButtonState();
            }
            // Trigger flipbook resize for fullscreen dimensions
            setTimeout(() => {
              if (window.app && window.app.pageFlip && window.app.pdfDocument) {
                const currentPageIndex = window.app.pageFlip.getCurrentPageIndex();
                const containerForFlipInstance = window.app.elements.flipBook;
                
                if (containerForFlipInstance.clientWidth > 0 && containerForFlipInstance.clientHeight > 0) {
                  const { pageWidth, pageHeight, isMobile } = window.calculateOptimalDimensions(
                    containerForFlipInstance.clientWidth,
                    containerForFlipInstance.clientHeight
                  );
                  
                  console.log('Reinitializing flipbook for fullscreen with dimensions:', pageWidth, pageHeight);
                  initFlipbookInstance(currentPageIndex, pageWidth, pageHeight, isMobile);
                }
              }
            }, 100);
            return;
          }
          
          if (command && command.action === 'fullscreenExited') {
            window.parentFullscreenState = false;
            console.log('Parent confirmed fullscreen exited');
            // Update button state when exiting fullscreen
            if (window.updateButtonState) {
              window.updateButtonState();
            }
            // Trigger flipbook resize for normal dimensions
            setTimeout(() => {
              if (window.app && window.app.pageFlip && window.app.pdfDocument) {
                const currentPageIndex = window.app.pageFlip.getCurrentPageIndex();
                const containerForFlipInstance = window.app.elements.flipBook;
                
                if (containerForFlipInstance.clientWidth > 0 && containerForFlipInstance.clientHeight > 0) {
                  const { pageWidth, pageHeight, isMobile } = window.calculateOptimalDimensions(
                    containerForFlipInstance.clientWidth,
                    containerForFlipInstance.clientHeight
                  );
                  
                  console.log('Reinitializing flipbook for normal view with dimensions:', pageWidth, pageHeight);
                  initFlipbookInstance(currentPageIndex, pageWidth, pageHeight, isMobile);
                }
              }
            }, 100);
            return;
          }

          // Make sure the flipbook app and instance exist for other commands
          if (!window.app || !window.app.pageFlip) {
            console.warn('Flipbook not ready to receive commands.');
            return;
          }

          // Route commands to the correct flipbook function
          if (command && command.action) {
            switch (command.action) {
              case 'navigate':
                if (command.direction === 'next') {
                  window.app.pageFlip.flipNext();
                } else if (command.direction === 'prev') {
                  window.app.pageFlip.flipPrev();
                }
                break;
              
              case 'goToPage':
                // The flip() method is zero-indexed, so subtract 1
                const pageIndex = parseInt(command.page, 10) - 1;
                if (!isNaN(pageIndex) && pageIndex >= 0) {
                  window.app.pageFlip.flip(pageIndex);
                }
                break;

              case 'download':
                // Send download request back to parent with PDF URL and filename
                const pdfUrl = "https://iwyjssxhrcucnrkzkvmt.supabase.co/storage/v1/object/public/magazine-pdfs//CXO%20TechBOT%20October%202024-1-10.pdf";
                const filename = pdfUrl.substring(pdfUrl.lastIndexOf("/") + 1) || "download.pdf";
                event.source.postMessage({
                  action: 'downloadResponse',
                  pdfUrl: pdfUrl,
                  filename: filename
                }, event.origin);
                break;
              
              // You can add more actions here
              // case 'getCurrentPage':
              //   const currentPage = window.app.pageFlip.getCurrentPageIndex() + 1;
              //   // Send a message back to the parent
              //   event.source.postMessage({ action: 'currentPage', page: currentPage }, event.origin);
              //   break;
            }
          }
        });
      });
    </script>

    <script>
      // Function to get URL parameter value
      function getURLParameter(name) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(name);
      }
      
      // Get page number from URL parameter 'page', fallback to server-side template, then to 1
      const urlPageNumber = getURLParameter('page');
      const serverPageNumber = "{{ page_number }}";
      const INITIAL_PAGE_NUMBER = parseInt(urlPageNumber, 10) || parseInt(serverPageNumber, 10) || 1;
      
      console.log('URL page parameter:', urlPageNumber);
      console.log('Server page number:', serverPageNumber);
      console.log('Final initial page number:', INITIAL_PAGE_NUMBER);
      
      (function () {
        "use strict";

        // Global state
        const app = {
          // Core components
          pageFlip: null,
          pdfDocument: null,

          // Cache and queues
          pageCache: new Map(),
          pendingRenderQueue: new Set(),

          // State flags
          isTransitioning: false,
          isResizing: false,
          isFullscreenTransition: false, // Add this back to prevent resize conflicts

          // Dimensions
          lastKnownWidth: 0,
          lastKnownHeight: 0,

          // Original styles for fullscreen (Removed as fullscreen state management is simplified)
          // originalStyles: {
          //   appHeaderForFlipbook: {},
          //   flipbookWrapper: {},
          //   flipbookContainer: {},
          //   progressBarSection: {},
          // },

          // DOM elements
          elements: {
            body: document.body,
            appHeaderForFlipbook: null,
            flipBookWrapper: null,
            flipBook: null,
            loadingOverlay: null,
            fullscreenBtn: null,
            fullscreenIcon: null,
            progressBarContainer: null,
            progressBarHandle: null,
            progressBarFill: null,
            currentPageInfo: null,
            totalPagesInfo: null,
            progressBarSection: null,
          },

          // Event state
          isDragging: false,
          dragStartX: 0,
          initialProgress: 0,
        };

        // Initialize application
        function init() {
          // Initialize DOM elements
          app.elements.appHeaderForFlipbook =
            document.querySelector(".App .App-header");
          app.elements.flipBookWrapper =
            document.getElementById("flipbook-wrapper");
          app.elements.flipBook = document.getElementById(

        // Function to calculate optimal dimensions based on screen size and aspect ratio
        function calculateOptimalDimensions(containerWidth, containerHeight) {
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const mobileBreakpoint = 768;
          const isMobile = viewportWidth < mobileBreakpoint;
          
          // Check if we're in fullscreen mode (either native fullscreen or parent iframe fullscreen)
          const inNativeFullscreen = !!(
            document.fullscreenElement ||
            document.webkitFullscreenElement ||
            document.mozFullScreenElement ||
            document.msFullscreenElement
          );
          
          const inParentFullscreen = window.parentFullscreenState || false;
          const inFullscreen = inNativeFullscreen || inParentFullscreen;
          
          // Standard page aspect ratio (A4-like: 0.707)
          const standardPageRatio = 0.707;
          
          if (inFullscreen) {
            // In fullscreen mode: make pages much larger
            if (isMobile) {
              // Mobile fullscreen: single page, use most of the screen
              let maxWidth = viewportWidth * 0.9;
              let maxHeight = viewportHeight * 0.8;
              
              let pageWidth = maxWidth;
              let pageHeight = pageWidth / standardPageRatio;
              
              if (pageHeight > maxHeight) {
                pageHeight = maxHeight;
                pageWidth = pageHeight * standardPageRatio;
              }
              
              return {
                pageWidth: Math.floor(pageWidth),
                pageHeight: Math.floor(pageHeight),
                isMobile: true
              };
            } else {
              // Desktop fullscreen: use most of the screen for the spread
              let maxWidth = viewportWidth * 0.95;
              let maxHeight = viewportHeight * 0.85;
              
              // Each page is half the spread width
              let pageWidth = Math.floor(maxWidth / 2);
              let pageHeight = pageWidth / standardPageRatio;
              
              if (pageHeight > maxHeight) {
                pageHeight = maxHeight;
                pageWidth = Math.floor(pageHeight * standardPageRatio);
              }
              
              return {
                pageWidth: Math.max(pageWidth, 400), // Minimum width for readability
                pageHeight: Math.max(pageHeight, 550), // Minimum height for readability
                isMobile: false
              };
            }
          } else {
            // Normal mode: smaller, contained dimensions
            if (isMobile) {
              let maxWidth = Math.min(containerWidth, viewportWidth * 0.9);
              let maxHeight = Math.min(containerHeight, viewportHeight * 0.6);
              
              let pageWidth = maxWidth;
              let pageHeight = pageWidth / standardPageRatio;
              
              if (pageHeight > maxHeight) {
                pageHeight = maxHeight;
                pageWidth = pageHeight * standardPageRatio;
              }
              
              return {
                pageWidth: Math.floor(pageWidth),
                pageHeight: Math.floor(pageHeight),
                isMobile: true
              };
            } else {
              let maxWidth = Math.min(containerWidth, viewportWidth * 0.85);
              let maxHeight = Math.min(containerHeight, viewportHeight * 0.75);
              
              let pageWidth = Math.floor(maxWidth / 2);
              let pageHeight = pageWidth / standardPageRatio;
              
              if (pageHeight > maxHeight) {
                pageHeight = maxHeight;
                pageWidth = Math.floor(pageHeight * standardPageRatio);
              }
              
              return {
                pageWidth,
                pageHeight,
                isMobile: false
              };
            }
          }
        }
        
        // Make calculateOptimalDimensions globally accessible
        window.calculateOptimalDimensions = calculateOptimalDimensions;

        // Initialize resize observer
        const resizeObserver = new ResizeObserver(async (entries) => {
          for (const entry of entries) {
            if (entry.target === app.elements.flipBookWrapper) {
              const { width, height } = entry.contentRect;
              if (
                Math.abs(width - app.lastKnownWidth) > 1 ||
                Math.abs(height - app.lastKnownHeight) > 1
              ) {
                app.lastKnownWidth = width;
                app.lastKnownHeight = height;
                // Skip resize handling during fullscreen transitions
                if (!app.isResizing && !app.isFullscreenTransition && app.pageFlip) {
                  try {
                    app.isResizing = true;
                    const currentPageIndex = app.pageFlip.getCurrentPageIndex();

                    const containerForFlipInstance = app.elements.flipBook;
                    if (
                      containerForFlipInstance.clientWidth > 0 &&
                      containerForFlipInstance.clientHeight > 0
                    ) {
                      // --- START CHANGE: Enhanced Responsive Logic ---
                      const { pageWidth, pageHeight, isMobile } = calculateOptimalDimensions(
                        containerForFlipInstance.clientWidth,
                        containerForFlipInstance.clientHeight
                      );
                      
                      await initFlipbookInstance(
                        currentPageIndex,
                        pageWidth,
                        pageHeight,
                        isMobile
                      );
                      // --- END CHANGE ---
                    } else {
                      console.warn(
                        "ResizeObserver: flipBook container has zero dimensions. Skipping reinitialization."
                      );
                    }
                  } catch (error) {
                    console.error(
                      "Error handling resize observer event:",
                      error
                    );
                  } finally {
                    app.isResizing = false;
                  }
                }
              }
            }
          }
        });

        // Cleanup function
        function cleanup() {
          if (app.pageFlip) {
            app.pageFlip.destroy();
            app.pageFlip = null;
          }
          app.pageCache.clear();
          app.pendingRenderQueue.clear();
          // if (app.elements.body.classList.contains("fullscreen-mode")) { // Removed: fullscreen-mode class management is simplified/removed
          //   app.elements.body.classList.remove("fullscreen-mode");
          // }
          resizeObserver.disconnect();
          
          // Clean up event listeners
          window.removeEventListener("resize", handleWindowResize);
          window.removeEventListener("orientationchange", handleWindowResize);
          if (windowResizeTimeout) {
            clearTimeout(windowResizeTimeout);
          }
        }

        // Debounced window resize handler for orientation changes
        let windowResizeTimeout;
        function handleWindowResize() {
          clearTimeout(windowResizeTimeout);
          windowResizeTimeout = setTimeout(async () => {
            // Skip resize handling during fullscreen transitions
            if (app.pageFlip && app.pdfDocument && !app.isFullscreenTransition) {
              try {
                const currentPageIndex = app.pageFlip.getCurrentPageIndex();
                const containerForFlipInstance = app.elements.flipBook;
                
                if (containerForFlipInstance.clientWidth > 0 && containerForFlipInstance.clientHeight > 0) {
                  const { pageWidth, pageHeight, isMobile } = calculateOptimalDimensions(
                    containerForFlipInstance.clientWidth,
                    containerForFlipInstance.clientHeight
                  );
                  
                  // Update container height for better fit
                  const optimalHeight = isMobile ? pageHeight + 40 : pageHeight + 40;
                  app.elements.flipBookWrapper.style.height = `${Math.min(optimalHeight, window.innerHeight * 0.8)}px`;
                  
                  await initFlipbookInstance(
                    currentPageIndex,
                    pageWidth,
                    pageHeight,
                    isMobile
                  );
                }
              } catch (error) {
                console.error("Error handling window resize:", error);
              }
            }
          }, 250); // 250ms debounce
        }

        // Set up application
        function setupApp() {
          if (app.elements.flipBookWrapper) {
            resizeObserver.observe(app.elements.flipBookWrapper);
          } else {
            console.error(
              "flipBookWrapper not found for ResizeObserver at setupApp."
            );
          }
          
          // Add window resize listener for orientation changes
          window.addEventListener("resize", handleWindowResize);
          window.addEventListener("orientationchange", () => {
            // Delay slightly for orientation change to complete
            setTimeout(handleWindowResize, 100);
          });
          
          window.addEventListener("unload", cleanup);
          window.app = app;
        }

        // Start initialization when DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", () => {
            init();
            setupApp();
            
            // Add event listener for URL changes (back/forward navigation)
            window.addEventListener('popstate', handleURLChange);
          });
        } else {
          init();
          setupApp();
          
          // Add event listener for URL changes (back/forward navigation)
          window.addEventListener('popstate', handleURLChange);
        }

        function createPageDiv(pageNumber, totalPages) {
          const pageDiv = document.createElement("div");
          pageDiv.className =
            "flipbook-page bg-gray-50 text-gray-800 flex flex-col justify-center items-center shadow-lg box-border";
          pageDiv.setAttribute("data-page-number", pageNumber);

          if (pageNumber === 1 || pageNumber === totalPages) {
            pageDiv.setAttribute("data-density", "hard");
          }

          const placeholder = document.createElement("div");
          placeholder.className = "page-placeholder";
          placeholder.innerHTML = `<div class="page-loading"></div>`;
          pageDiv.appendChild(placeholder);
          return pageDiv;
        }

        async function renderPageToCanvas(pageNumber) {
          try {
            const useCache =
              !app.isResizing && // isFullscreenTransition removed
              app.pageCache.has(pageNumber) &&
              document.querySelector(`[data-page-number="${pageNumber}"]`);

            if (useCache) {
              return app.pageCache.get(pageNumber);
            }

            const page = await app.pdfDocument.getPage(pageNumber);

            const pageFlipSettings = app.pageFlip.getSettings();
            const currentPageWidth = pageFlipSettings.width;
            const currentPageHeight = pageFlipSettings.height;

            const pagePadding = 0;
            const containerWidth = currentPageWidth - 2 * pagePadding;
            const containerHeight = currentPageHeight - 2 * pagePadding;

            const viewportOriginal = page.getViewport({ scale: 1.0 });
            const baseScale = Math.min(
              containerWidth / viewportOriginal.width,
              containerHeight / viewportOriginal.height
            );

            const qualityMultiplier = window.devicePixelRatio > 1.5 ? 1.5 : 2;
            const renderScale = baseScale * qualityMultiplier;
            const viewport = page.getViewport({ scale: renderScale });

            const pageContentHolder = document.createElement("div");
            pageContentHolder.style.position = "relative";
            pageContentHolder.style.width = `${containerWidth}px`;
            pageContentHolder.style.height = `${containerHeight}px`;
            pageContentHolder.style.margin = "auto";
            pageContentHolder.style.overflow = "hidden";

            const canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = `${containerWidth}px`;
            canvas.style.height = `${containerHeight}px`;
            pageContentHolder.appendChild(canvas);

            const context = canvas.getContext("2d");

            const renderContext = {
              canvasContext: context,
              viewport: viewport,
            };

            await page.render(renderContext).promise;

            const linkContainer = document.createElement("div");
            linkContainer.style.position = "absolute";
            linkContainer.style.top = "0";
            linkContainer.style.left = "0";
            linkContainer.style.width = "100%";
            linkContainer.style.height = "100%";
            linkContainer.style.pointerEvents = "none";

            const annotations = await page.getAnnotations();
            let linkCount = 0;

            for (const annotation of annotations) {
              if (annotation.subtype === "Link") {
                linkCount++;
                const rect = viewport.convertToViewportRectangle(
                  annotation.rect
                );
                const [x1, y1, x2, y2] = rect;

                const linkOverlay = document.createElement("div");
                linkOverlay.className = "pdf-link-overlay";

                const scaleFactorToCanvasStyle =
                  containerWidth / viewport.width;

                linkOverlay.style.left = `${
                  Math.min(x1, x2) * scaleFactorToCanvasStyle
                }px`;
                linkOverlay.style.top = `${
                  Math.min(y1, y2) * scaleFactorToCanvasStyle
                }px`;
                linkOverlay.style.width = `${
                  Math.abs(x2 - x1) * scaleFactorToCanvasStyle
                }px`;
                linkOverlay.style.height = `${
                  Math.abs(y2 - y1) * scaleFactorToCanvasStyle
                }px`;
                linkOverlay.style.pointerEvents = "auto";

                if (annotation.url) {
                  linkOverlay.title = annotation.url;
                  linkOverlay.setAttribute("data-url", annotation.url);
                  linkOverlay.addEventListener(
                    "click",
                    (e) => {
                      e.stopPropagation();
                      e.preventDefault();
                      window.open(annotation.url, "_blank");
                    },
                    true
                  );
                } else if (annotation.dest) {
                  linkOverlay.title = "Go to page";
                  linkOverlay.setAttribute(
                    "data-dest",
                    JSON.stringify(annotation.dest)
                  );
                  linkOverlay.addEventListener(
                    "click",
                    async (e) => {
                      e.stopPropagation();
                      e.preventDefault();
                      try {
                        const destArray = JSON.parse(
                          linkOverlay.getAttribute("data-dest")
                        );
                        const destInfo = await app.pdfDocument.getDestination(
                          destArray
                        );
                        if (destInfo && destInfo.length > 0) {
                          const pageRef = destInfo[0];
                          const targetPageNum =
                            (await app.pdfDocument.getPageIndex(pageRef)) + 1;
                          if (app.pageFlip)
                            app.pageFlip.flip(targetPageNum - 1);
                        }
                      } catch (error) {
                        console.error(
                          "Error navigating to internal link:",
                          error
                        );
                      }
                    },
                    true
                  );
                }
                linkContainer.appendChild(linkOverlay);
              }
            }
            if (linkCount > 0) pageContentHolder.appendChild(linkContainer);

            app.pageCache.set(pageNumber, pageContentHolder);
            return pageContentHolder;
          } catch (error) {
            console.error(`Error rendering page ${pageNumber}:`, error);
            const errorElem = document.createElement("div");
            errorElem.className = "text-red-500 p-4 text-center";
            errorElem.innerHTML = `<p>Error loading page ${pageNumber}.</p><p class="text-xs">${
              error.message || ""
            }</p>`;
            return errorElem;
          }
        }

        async function updatePageContent(pageNumber, totalPages) {
          const pageSelector = `[data-page-number="${pageNumber}"]`;
          const pageDiv = document.querySelector(pageSelector);
          if (!pageDiv) {
            return;
          }

          const updateStartTime = Date.now();
          const MIN_UPDATE_DELAY = 100;

          try {
            pageDiv.innerHTML = `
                    <div class="page-placeholder flex items-center justify-center">
                        <div class="page-loading"></div>
                    </div>`;

            const contentHolder = await Promise.race([
              renderPageToCanvas(pageNumber),
              new Promise((_, reject) =>
                setTimeout(
                  () => reject(new Error("Page render timeout")),
                  10000
                )
              ),
            ]);

            const elapsedTime = Date.now() - updateStartTime;
            if (elapsedTime < MIN_UPDATE_DELAY) {
              await new Promise((resolve) =>
                setTimeout(resolve, MIN_UPDATE_DELAY - elapsedTime)
              );
            }

            if (document.contains(pageDiv)) {
              pageDiv.innerHTML = "";
              pageDiv.appendChild(contentHolder);
              if (pageNumber > 1 && pageNumber < totalPages) {
                if (getComputedStyle(pageDiv).position === "static") {
                  pageDiv.style.position = "relative";
                }
                // const pageNumDisplay = document.createElement("div");
                // pageNumDisplay.className =
                //   "absolute bottom-2 right-2 text-xs text-gray-500 " +
                //   "bg-white/50 px-2 py-1 rounded backdrop-blur-sm";
                // pageNumDisplay.textContent = `Page ${pageNumber}`;
                // pageDiv.appendChild(pageNumDisplay);
              }
            }
          } catch (error) {
            console.error(`Error updating page ${pageNumber}:`, error);
            if (document.contains(pageDiv)) {
              pageDiv.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full p-4 text-red-500">
                            <svg class="w-6 h-6 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <div>Error loading page</div>
                        </div>`;
            }
          }
        }

        async function handlePageFlipEvent(e) {
          if (!app.pdfDocument || !app.pageFlip) return;

          const newPageIndex = e.data;
          const currentPageNumber = newPageIndex + 1;
          const totalPages = app.pdfDocument.numPages;

          updateProgressBar(newPageIndex, totalPages);

          // Update URL with current page number
          updateURLWithPage(currentPageNumber);

          // Send page change message to parent window (if in iframe)
          sendPageChangeToParent(currentPageNumber);

          const pagesToRender = new Set([currentPageNumber]);
          if (
            !app.pageFlip.getSettings().usePortrait &&
            currentPageNumber < totalPages
          ) {
            pagesToRender.add(currentPageNumber + 1);
          }
          await preRenderPages(Array.from(pagesToRender), totalPages);
        }

        // Function to send page change messages to parent window
        function sendPageChangeToParent(pageNumber) {
          try {
            // Check if we're in an iframe
            if (window.parent && window.parent !== window) {
              const message = {
                type: 'pageChange',
                pageNumber: pageNumber,
                timestamp: Date.now(),
                source: 'testing-mag-iframe'
              };
              
              console.log('Sending page change message to parent:', message);
              
              // Send message to parent window
              // Using '*' as target origin for now, but in production you should specify the actual parent origin
              window.parent.postMessage(message, '*');
            } else {
              console.log('Not in iframe, skipping parent notification for page:', pageNumber);
            }
          } catch (error) {
            console.error('Error sending page change message to parent:', error);
          }
        }

        // Function to update URL without reloading the page
        function updateURLWithPage(pageNumber) {
          const url = new URL(window.location);
          url.searchParams.set('page', pageNumber.toString());
          
          // Update URL without reloading the page
          window.history.pushState({ page: pageNumber }, '', url.toString());
          
          console.log('Updated URL to page:', pageNumber);
        }

        // Function to handle URL changes (back/forward navigation)
        function handleURLChange() {
          const currentPage = getURLParameter('page');
          const newPageNumber = parseInt(currentPage, 10);
          
          if (newPageNumber && app.pdfDocument && app.pageFlip) {
            const totalPages = app.pdfDocument.numPages;
            const validatedPageNumber = Math.max(1, Math.min(newPageNumber, totalPages));
            const targetPageIndex = validatedPageNumber - 1;
            
            // Only flip if we're not already on this page
            const currentPageIndex = app.pageFlip.getCurrentPageIndex();
            if (currentPageIndex !== targetPageIndex) {
              console.log(`URL changed to page ${newPageNumber}, flipping to page ${validatedPageNumber}`);
              app.pageFlip.flip(targetPageIndex);
            }
          }
        }

        async function preRenderPages(targetPages, totalPages) {
          if (app.isTransitioning || !targetPages.length) return;

          const RANGE = 2;
          const pagesToRender = new Set();

          for (const page of targetPages) {
            for (let i = -RANGE; i <= RANGE; i++) {
              const neighborPage = page + i;
              if (neighborPage > 0 && neighborPage <= totalPages) {
                pagesToRender.add(neighborPage);
              }
            }
          }

          app.pendingRenderQueue.clear();
          for (const pageNum of pagesToRender) {
            if (!app.pageCache.has(pageNum)) {
              app.pendingRenderQueue.add(pageNum);
            }
          }

          const CONCURRENT_RENDERS = 2;
          const pages = Array.from(app.pendingRenderQueue);

          try {
            await Promise.all(
              Array(CONCURRENT_RENDERS)
                .fill()
                .map(async () => {
                  while (pages.length > 0) {
                    const pageNum = pages.shift();
                    try {
                      await updatePageContent(pageNum, totalPages);
                      app.pendingRenderQueue.delete(pageNum);
                    } catch (error) {
                      // Error already logged in updatePageContent
                    }
                  }
                })
            );
          } catch (error) {
            console.error("Error in pre-rendering process:", error);
          }
        }

        async function loadPDF(pdfUrl) {
          if (!app.elements.loadingOverlay || !app.elements.flipBook) {
            console.error("Essential elements for PDF loading are missing.");
            return;
          }
          app.elements.loadingOverlay.style.display = "flex";

          try {
            app.elements.flipBook.innerHTML = "";
            app.pageCache.clear();

            const loadingTask = pdfjsLib.getDocument(pdfUrl);
            app.pdfDocument = await Promise.race([
              loadingTask.promise,
              new Promise((_, reject) =>
                setTimeout(
                  () => reject(new Error("PDF loading timeout")),
                  30000
                )
              ),
            ]);

            const totalPages = app.pdfDocument.numPages;

            for (let i = 1; i <= totalPages; i++) {
              const pageDiv = createPageDiv(i, totalPages);
              app.elements.flipBook.appendChild(pageDiv);
            }

            await waitForReflow();

            const flipbookContainerElement = app.elements.flipBook;
            let containerWidth = flipbookContainerElement.clientWidth;
            let containerHeight = flipbookContainerElement.clientHeight;

            if (containerWidth <= 0 || containerHeight <= 0) {
              console.error(
                "Flipbook container has zero dimensions before initial init."
              );
              app.elements.flipBook.innerHTML = `<div class="p-5 text-red-500 text-center">Error: Flipbook container has invalid dimensions. Cannot display content.</div>`;
              app.elements.loadingOverlay.style.display = "none";
              return;
            }

            // --- START CHANGE: Enhanced Responsive Logic ---
            const { pageWidth, pageHeight, isMobile } = calculateOptimalDimensions(containerWidth, containerHeight);
            
            // Update container dimensions if needed for better aspect ratio
            if (pageHeight * (isMobile ? 1 : 2) !== containerHeight) {
              const optimalHeight = pageHeight;
              app.elements.flipBookWrapper.style.height = `${optimalHeight}px`;
              containerHeight = optimalHeight;
            }
            // --- END CHANGE ---

            // Validate and convert page number to zero-based index for flipbook
            const validatedPageNumber = Math.max(1, Math.min(INITIAL_PAGE_NUMBER, totalPages));
            const initialPageIndex = validatedPageNumber - 1;
            
            console.log(`PDF has ${totalPages} pages. Requested page: ${INITIAL_PAGE_NUMBER}, Using page: ${validatedPageNumber}`);
            
            // --- START CHANGE: Pass `isMobile` flag ---
            await initFlipbookInstance(initialPageIndex, pageWidth, pageHeight, isMobile);
            // --- END CHANGE ---


            // Calculate initial pages to render around the starting page
            const startPage = INITIAL_PAGE_NUMBER;
            const initialPages = new Set([
              startPage,
              ...(startPage > 1 ? [startPage - 1] : []),
              ...(startPage < totalPages ? [startPage + 1] : []),
              ...(startPage > 2 ? [1] : []), // Always include first page for cover
              ...(startPage < totalPages - 1 ? [totalPages] : []), // Always include last page
            ]);

            await Promise.all(
              Array.from(initialPages).map((pageNum) => {
                if (
                  app.elements.flipBook.querySelector(
                    `[data-page-number="${pageNum}"]`
                  )
                ) {
                  return updatePageContent(pageNum, totalPages);
                }
                return Promise.resolve();
              })
            );

            await waitForReflow();
            initializeProgressBar();
            // Update progress bar to reflect the initial page
            updateProgressBar(initialPageIndex, totalPages);
            // Send initial page notification to parent
            sendPageChangeToParent(INITIAL_PAGE_NUMBER);
          } catch (error) {
            console.error("Error loading PDF:", error);
            app.elements.flipBook.innerHTML = `
                    <div class="p-5 text-red-500 flex flex-col items-center justify-center">
                        <svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                        </svg>
                        <div>Failed to load PDF: ${error.message}</div>
                    </div>`;
          } finally {
            app.elements.loadingOverlay.style.display = "none";
          }
        }

        // --- START CHANGE: Update function to accept `isMobile` flag ---
        async function initFlipbookInstance(startPageIdx, pageW, pageH, isMobile) {
        // --- END CHANGE ---
          // Skip initialization during fullscreen transitions
          if ((app.isResizing && app.pageFlip) || app.isFullscreenTransition) {
            console.log("Skipping flipbook initialization during transition");
            return;
          }

          try {
            app.isResizing = true;

            if (app.pageFlip) {
              const currentIdx = app.pageFlip.getCurrentPageIndex();
              app.pageFlip.destroy();
              app.pageFlip = null;
              startPageIdx = currentIdx;
            }

            await waitForReflow();

            const flipBookElement = app.elements.flipBook;
            if (!flipBookElement || pageW <= 0 || pageH <= 0) {
              console.error(
                "Flipbook container not ready or invalid dimensions for init.",
                pageW,
                pageH,
                flipBookElement
              );
              throw new Error(
                "Flipbook container not ready or invalid dimensions."
              );
            }

            const pageElements =
              flipBookElement.querySelectorAll(".flipbook-page");
            if (!pageElements.length) {
              console.log("No page elements found, deferring initialization");
              // Defer initialization if no page elements (common during transitions)
              setTimeout(() => {
                if (!app.isFullscreenTransition) {
                  initFlipbookInstance(startPageIdx, pageW, pageH, isMobile);
                }
              }, 200);
              return;
            }

            app.pageFlip = new St.PageFlip(flipBookElement, {
              width: pageW,
              height: pageH,
              size: "fixed",
              minWidth: Math.min(300, pageW),
              maxWidth: pageW,
              minHeight: Math.min(400, pageH),
              maxHeight: pageH,
              maxShadowOpacity: 0.5,
              showCover: true,
              mobileScrollSupport: true,
              flippingTime: 800,
              // --- START CHANGE: Set usePortrait based on mobile state ---
              usePortrait: isMobile,
              // --- END CHANGE ---
              startPage: startPageIdx,
              startZIndex: 20,
              autoSize: false,
              drawShadow: true,
            });

            await Promise.race([
              new Promise((resolve) => {
                app.pageFlip.loadFromHTML(pageElements);
                app.pageFlip.flip(startPageIdx, "immediate");
                setTimeout(resolve, 150);
              }),
              new Promise((_, reject) =>
                setTimeout(
                  () => reject(new Error("PageFlip HTML loading timeout")),
                  5000
                )
              ),
            ]);

            app.pageFlip.off("flip");
            app.pageFlip.off("changeState");

            app.pageFlip.on("flip", handlePageFlipEvent);
            app.pageFlip.on("changeState", (e) => {
              if (e.data === "read") {
                handlePageFlipEvent({
                  data: app.pageFlip.getCurrentPageIndex(),
                });
              }
            });
            handlePageFlipEvent({ data: startPageIdx });

            return app.pageFlip;
          } catch (error) {
            console.error("Error initializing flipbook:", error);
            if (app.pageFlip) {
              app.pageFlip.destroy();
              app.pageFlip = null;
            }
          } finally {
            app.isResizing = false;
          }
        }

        function updateProgressBar(currentPageIndex, totalPages) {
          const elements = {
            fill: document.getElementById("progress-bar-fill"),
            handle: document.getElementById("progress-bar-handle"),
          };

          if (Object.values(elements).some((el) => !el)) return;

          const progress = (() => {
            if (totalPages <= 1) return currentPageIndex >= 0 ? 100 : 0;
            return Math.max(
              0,
              Math.min(100, (currentPageIndex / (totalPages - 1)) * 100)
            );
          })();

          const currentPageDisplay = currentPageIndex + 1;
          const progressPercent = Math.round(progress);

          try {
            elements.fill.style.width = `${progress}%`;
            elements.handle.style.left = `${progress}%`;
            elements.handle.setAttribute("aria-valuenow", progressPercent);
            elements.handle.setAttribute(
              "aria-valuetext",
              `${progressPercent}% complete`
            );
          } catch (error) {
            console.error("Error updating progress bar:", error);
          }
        }

        function initializeProgressBar() {
          const elements = {
            container: document.querySelector(".progress-bar-container"),
            handle: document.getElementById("progress-bar-handle"),
            fill: document.getElementById("progress-bar-fill"),
            tooltip: document.getElementById("progress-tooltip"),
            tooltipPageInfo: document.getElementById("tooltip-page-info"),
          };

          if (Object.values(elements).some((el) => !el)) {
            console.error("Missing progress bar elements for init");
            return;
          }

          const state = { isDragging: false };

          function updatePosition(progress) {
            const validProgress = Math.max(0, Math.min(100, progress));
            elements.fill.style.width = `${validProgress}%`;
            elements.handle.style.left = `${validProgress}%`;
          }

          function showTooltip() {
            if (elements.tooltip) {
              elements.tooltip.style.opacity = '1';
            }
          }

          function hideTooltip() {
            if (elements.tooltip) {
              elements.tooltip.style.opacity = '0';
            }
          }

          function seekToProgress(progress) {
            if (!app.pdfDocument || !app.pageFlip) return;
            const targetPage =
              app.pdfDocument.numPages <= 1
                ? 0
                : Math.round((progress / 100) * (app.pdfDocument.numPages - 1));

            if (targetPage >= 0 && targetPage < app.pdfDocument.numPages) {
              app.pageFlip.flip(targetPage);
            }
          }

          const handlers = {
            startDrag(e) {
              e.preventDefault();
              state.isDragging = true;
              document.addEventListener("mousemove", handlers.drag);
              document.addEventListener("mouseup", handlers.stopDrag);
              document.body.style.userSelect = "none";
            },

            drag(e) {
              if (!state.isDragging || !app.pdfDocument) return;
              const rect = elements.container.getBoundingClientRect();
              const progress = ((e.clientX - rect.left) / rect.width) * 100;
              updatePosition(progress);
            },

            stopDrag() {
              if (!state.isDragging) return;
              state.isDragging = false;
              document.removeEventListener("mousemove", handlers.drag);
              document.removeEventListener("mouseup", handlers.stopDrag);
              document.body.style.userSelect = "";
              const progress = parseFloat(elements.handle.style.left) || 0;
              seekToProgress(progress);
            },

            handleClick(e) {
              if (state.isDragging || !app.pdfDocument || !app.pageFlip) return;
              const rect = elements.container.getBoundingClientRect();
              const progress = ((e.clientX - rect.left) / rect.width) * 100;
              updatePosition(progress);
              seekToProgress(progress);
            },
            handleMouseEnter() {
              showTooltip();
            },
            
            handleMouseLeave() {
              hideTooltip();
            },
            
            handleMouseMove(e) {
                if (!app.pdfDocument || !elements.tooltip) return;

                const containerRect = elements.container.getBoundingClientRect();
                const containerWidth = containerRect.width;

                // Calculate mouse X position relative to the container and clamp it
                let relativeX = e.clientX - containerRect.left;
                relativeX = Math.max(0, Math.min(relativeX, containerWidth));
                
                // Calculate progress percentage from the clamped relativeX
                const progress = (relativeX / containerWidth) * 100;
                
                // Update the tooltip's text content first (this might change its width)
                const totalPages = app.pdfDocument.numPages;
                const pageIndex = totalPages <= 1 ? 0 : Math.round((progress / 100) * (totalPages - 1));
                elements.tooltipPageInfo.textContent = `${pageIndex + 1} of ${totalPages}`;

                // Get the tooltip's current width
                const tooltipWidth = elements.tooltip.offsetWidth;

                // Calculate the ideal left position to center the tooltip over the mouse
                const idealLeft = relativeX - (tooltipWidth / 2);

                // Clamp the left position to keep the tooltip within the container's bounds
                const finalLeft = Math.max(0, Math.min(idealLeft, containerWidth - tooltipWidth));

                // Set the position in pixels, not percentage
                elements.tooltip.style.left = `${finalLeft}px`;
            }
          };

          elements.handle.addEventListener("mousedown", handlers.startDrag);
          elements.container.addEventListener("click", handlers.handleClick);
          
          // Add hover functionality for tooltip
          elements.container.addEventListener("mouseenter", handlers.handleMouseEnter);
          elements.container.addEventListener("mouseleave", handlers.handleMouseLeave);
          elements.container.addEventListener("mousemove", handlers.handleMouseMove);
        }

        async function waitForReflow() {
          return new Promise((resolve) => requestAnimationFrame(resolve));
        }

        // Dynamic Fullscreen Toggle Functionality
        function initializeFullscreenButton() {
          const fullscreenIcon = app.elements.fullscreenIcon;
          const fullscreenBtn = app.elements.fullscreenBtn;
          
          // SVG content for different states
          const enterFullscreenSVG = `
            <path id="Full_screen" data-name="Full screen" class="cls-1"
                  fill="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"
                  d="M92.583,1957.11h1.871a1.561,1.561,0,0,0,0-3.12H88.48a1.529,1.529,0,0,0-1.493,1.56v6.24a1.495,1.495,0,1,0,2.987,0v-3l6.293,6.66a1.511,1.511,0,1,0,2.134-2.14Zm20.775,0.02h-1.89a1.571,1.571,0,0,1,0-3.14H117.5a1.539,1.539,0,0,1,1.509,1.57v6.29a1.51,1.51,0,1,1-3.018,0v-3.02l-6.359,6.71a1.526,1.526,0,1,1-2.156-2.16Zm-20.775,25.76h1.871a1.561,1.561,0,0,1,0,3.12H88.48a1.529,1.529,0,0,1-1.493-1.56v-6.24a1.495,1.495,0,1,1,2.987,0v3l6.293-6.66a1.511,1.511,0,1,1,2.134,2.14Zm20.775-.02h-1.89a1.571,1.571,0,0,0,0,3.14H117.5a1.539,1.539,0,0,0,1.509-1.57v-6.29a1.51,1.51,0,1,0-3.018,0v3.02l-6.359-6.71a1.526,1.526,0,1,0-2.156,2.16Z"
                  transform="translate(-87 -1954)"/>`;
          
          const exitFullscreenSVG = `
            <path id="Exit_full_screen" data-name="Exit full screen"
                  fill="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="0"
                  d="M202.583,1977.11h1.871a1.562,1.562,0,0,0,0-3.12H198.48a1.529,1.529,0,0,0-1.493,1.56v6.24a1.495,1.495,0,1,0,2.987,0v-3l6.293,6.66a1.511,1.511,0,1,0,2.133-2.14Zm-19.225.02h-1.89a1.571,1.571,0,0,1,0-3.14H187.5a1.539,1.539,0,0,1,1.509,1.57v6.29a1.51,1.51,0,1,1-3.018,0v-3.02l-6.359,6.71a1.526,1.526,0,0,1-2.156-2.16Zm19.319-14.24h1.88a1.561,1.561,0,0,1,0,3.12h-6a1.532,1.532,0,0,1-1.5-1.56v-6.24a1.5,1.5,0,1,1,3,0v3l6.324-6.66a1.526,1.526,0,0,1,2.144,0,1.511,1.511,0,0,1,0,2.14Zm-19.319-.02h-1.9a1.571,1.571,0,0,0,0,3.14h6.066a1.542,1.542,0,0,0,1.517-1.57v-6.29a1.517,1.517,0,1,0-3.033,0v3.02l-6.391-6.71a1.529,1.529,0,1,0-2.166,2.16Z"
                  transform="translate(-177 -1954)"/>`;

          // Track fullscreen state via parent communication
          // Initialize global fullscreen state for parent communication
          window.parentFullscreenState = false;
          
          function isInFullscreen() {
            // Check if this document is in fullscreen
            const documentInFullscreen = !!(
              document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.mozFullScreenElement ||
              document.msFullscreenElement
            );
            
            // If we're in an iframe, use the state tracked via parent messages
            if (window.parent && window.parent !== window) {
              return window.parentFullscreenState || false;
            }
            
            return documentInFullscreen;
          }

          function updateButtonState() {
            const inFullscreen = isInFullscreen();
            console.log("Updating button state. In fullscreen:", inFullscreen);
            
            // Reset transition flag after a shorter delay to allow natural resize handling
            if (app.isFullscreenTransition) {
              console.log("Fullscreen transition completed, resetting flag after delay");
              setTimeout(() => {
                app.isFullscreenTransition = false;
                console.log("Transition flag reset - resize observers can now handle dimension changes");
              }, 300); // Shorter delay to let resize observers handle the changes
            }
            
            if (fullscreenIcon) {
              const parentSvg = fullscreenIcon.closest('svg');
              if (parentSvg) {
                parentSvg.setAttribute('viewBox', '0 0 32 32');
              }
              
              if (inFullscreen) {
                fullscreenIcon.innerHTML = exitFullscreenSVG;
                fullscreenBtn.title = "Exit Fullscreen";
              } else {
                fullscreenIcon.innerHTML = enterFullscreenSVG;
                fullscreenBtn.title = "Enter Fullscreen";
              }
            }
          }
          
          // Make updateButtonState globally accessible
          window.updateButtonState = updateButtonState;

          function triggerEnterFullscreen() {
            console.log("triggerEnterFullscreen() function called");
            
            // Set transition flag to prevent resize conflicts
            app.isFullscreenTransition = true;
            
            // Send message to parent window to request iframe fullscreen
            try {
              if (window.parent && window.parent !== window) {
                console.log("Sending fullscreen request to parent window...");
                window.parent.postMessage({
                  action: 'requestFullscreen'
                }, '*');
              } else {
                // Fallback: enter fullscreen on this document if not in iframe
                console.log("Not in iframe - attempting to enter fullscreen on this document...");
                const element = document.documentElement;
                
                if (element.requestFullscreen) {
                  element.requestFullscreen().catch((err) => {
                    console.warn("Could not enter fullscreen on this document:", err);
                    app.isFullscreenTransition = false;
                  });
                } else if (element.webkitRequestFullscreen) {
                  element.webkitRequestFullscreen();
                } else if (element.mozRequestFullScreen) {
                  element.mozRequestFullScreen();
                } else if (element.msRequestFullscreen) {
                  element.msRequestFullscreen();
                }
              }
            } catch (e) {
              console.error("Error requesting fullscreen:", e);
              app.isFullscreenTransition = false;
            }
          }

          function triggerExitFullscreen() {
            console.log("triggerExitFullscreen() function called");
            
            // Set transition flag to prevent resize conflicts
            app.isFullscreenTransition = true;
            
            // Send message to parent window to request exit fullscreen
            try {
              if (window.parent && window.parent !== window) {
                console.log("Sending exit fullscreen request to parent window...");
                window.parent.postMessage({
                  action: 'exitFullscreen'
                }, '*');
              } else {
                // Fallback: exit fullscreen on this document if not in iframe
                console.log("Not in iframe - attempting to exit fullscreen on this document...");
                if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                  if (document.exitFullscreen) {
                    document.exitFullscreen().catch((err) => {
                      console.warn("Could not exit fullscreen on this document:", err);
                      app.isFullscreenTransition = false;
                    });
                  } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                  }
                } else {
                  console.warn("No fullscreen element found to exit.");
                  app.isFullscreenTransition = false;
                }
              }
            } catch (e) {
              console.error("Error requesting exit fullscreen:", e);
              app.isFullscreenTransition = false;
            }
          }

          // Initial button state setup
          updateButtonState();

          // Click handler for toggle functionality
          fullscreenBtn.addEventListener("click", () => {
            const inFullscreen = isInFullscreen();
            console.log("Fullscreen button clicked. Current state:", inFullscreen ? "fullscreen" : "normal");
            
            if (inFullscreen) {
              triggerExitFullscreen();
            } else {
              triggerEnterFullscreen();
            }
          });

          // Listen for fullscreen change events to update button state
          const fullscreenEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
          
          fullscreenEvents.forEach(eventName => {
            document.addEventListener(eventName, updateButtonState);
            
            // Also listen on parent document if in iframe
            try {
              if (window.parent && window.parent !== window) {
                window.parent.document.addEventListener(eventName, updateButtonState);
              }
            } catch (e) {
              // Cross-origin restriction
            }
          });

          // Listen for Escape key to update UI when fullscreen is exited
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
              console.log("Escape key detected - updating button state");
              setTimeout(updateButtonState, 100); // Small delay to let fullscreen exit complete
            }
          });
        }

        // Download Functionality
        function initializeDownloadButton() {
          const downloadBtn = document.getElementById("download-btn");

          if (!downloadBtn) return;

          downloadBtn.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopPropagation();

            try {
              // Check if we're in an iframe and use postMessage
              if (window.parent && window.parent !== window) {
                console.log('Iframe download button clicked - sending message to parent');
                const pdfUrl = "https://iwyjssxhrcucnrkzkvmt.supabase.co/storage/v1/object/public/magazine-pdfs//CXO%20TechBOT%20October%202024-1-10.pdf";
                const filename = pdfUrl.substring(pdfUrl.lastIndexOf("/") + 1) || "download.pdf";
                
                // Send download request to parent
                window.parent.postMessage({
                  action: 'downloadResponse',
                  pdfUrl: pdfUrl,
                  filename: filename
                }, '*');
              } else {
                // Fallback for non-iframe usage
                const pdfUrl =
                  "https://iwyjssxhrcucnrkzkvmt.supabase.co/storage/v1/object/public/magazine-pdfs//CXO%20TechBOT%20October%202024-1-10.pdf";
                const link = document.createElement("a");
                link.href = pdfUrl;
                const filename =
                  pdfUrl.substring(pdfUrl.lastIndexOf("/") + 1) || "download.pdf";
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
              }
            } catch (error) {
              console.error("Error downloading PDF:", error);
            }
          });
        }

      })(); // End IIFE
    </script>
